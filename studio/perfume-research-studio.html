<title>ရေမွေး Review Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+Myanmar:wght@400;600&family=Noto+Serif+Myanmar:wght@600&display=swap">
<style>
/* Layout: search bar on top; saved perfumes as a library rail on the left (a chip row on phones); the open perfume on the right in five steps: about, compare & check, wear test, video, posting */
:root {
  --bg: #F1F2F6;
  --surface: #FFFFFF;
  --ink: #1A1C28;
  --muted: #5D6173;
  --line: #D9DBE3;
  --amber: #93600F;
  --amber-soft: #F3E6CE;
  --navy: #24315E;
  --navy-soft: #E3E7F3;
  --good: #2E7A4D;
  --warn: #9A5800;
  --bad: #B03838;
  --s1: #93600F;
  --s2: #24315E;
  --s3: #2E7A4D;
  --s4: #7A3F8C;
  --f-display: "Bodoni Moda", "Noto Serif Myanmar", Didot, Georgia, serif;
  --f-body: "Instrument Sans", "Noto Sans Myanmar", "Myanmar Text", Padauk, system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111219; --surface: #1A1C26; --ink: #ECEAE4; --muted: #A3A6B5; --line: #2D303E;
    --amber: #E0AA55; --amber-soft: #3A2E1A; --navy: #A9B9EE; --navy-soft: #232A44;
    --good: #6FC28F; --warn: #E4A04A; --bad: #E57A7A;
    --s1: #E0AA55; --s2: #A9B9EE; --s3: #6FC28F; --s4: #CDA2E0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111219; --surface: #1A1C26; --ink: #ECEAE4; --muted: #A3A6B5; --line: #2D303E;
  --amber: #E0AA55; --amber-soft: #3A2E1A; --navy: #A9B9EE; --navy-soft: #232A44;
  --good: #6FC28F; --warn: #E4A04A; --bad: #E57A7A;
  --s1: #E0AA55; --s2: #A9B9EE; --s3: #6FC28F; --s4: #CDA2E0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.8; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.35; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
a { color: var(--navy); }

.app { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 72px; display: grid; gap: 18px; }

/* top */
.top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px 24px; align-items: center; }
.brand { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.brand .mm { font-family: "Noto Serif Myanmar", var(--f-display); font-size: 22px; font-weight: 600; }
.brand .en { font-family: var(--f-display); font-style: italic; font-size: 22px; color: var(--amber); }
.search { display: flex; gap: 8px; min-width: 0; }
.search input { flex: 1; min-width: 0; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.search input::placeholder { color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; white-space: nowrap; font-size: 14px; line-height: 1.6; text-decoration: none; color: var(--ink); display: inline-block; }
.btn:hover:not(:disabled) { border-color: var(--amber); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; padding: 10px 18px; }
.btn.danger { color: var(--bad); }
.btn.small { padding: 2px 10px; font-size: 13px; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.top .hint { grid-column: 1 / -1; }

.gen { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--r); background: var(--amber-soft); font-size: 14px; }
.gen .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); flex: none; }
@media (prefers-reduced-motion: no-preference) { .gen.busy .dot { animation: pulse 1.2s ease-in-out infinite; } }
@keyframes pulse { 50% { opacity: .25; } }
.gen.err { background: transparent; border: 1px solid var(--bad); color: var(--bad); }
.gen.err .dot { background: var(--bad); }
.gen.ok { background: var(--navy-soft); }
.gen .msg { flex: 1; min-width: 12rem; }
.gen .count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }

/* layout */
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 24px; align-items: start; }
.lib { display: grid; gap: 6px; min-width: 0; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.lib-h { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 2px; }
.lib-list { display: grid; gap: 4px; }
.item { text-align: left; width: 100%; border: 1px solid transparent; background: transparent; border-radius: var(--r); padding: 9px 12px; cursor: pointer; display: grid; gap: 3px; line-height: 1.5; }
.item:hover { background: var(--surface); }
.item[aria-current="true"] { background: var(--surface); border-color: var(--line); }
.item .nm { font-weight: 600; }
.item .meta { display: flex; gap: 6px; flex-wrap: wrap; }
.lib-empty { font-size: 14px; color: var(--muted); padding: 10px 12px; border: 1px dashed var(--line); border-radius: var(--r); }
.arch { margin-top: 10px; }
.arch summary { cursor: pointer; font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 4px 0; }
.arch .lib-list { margin-top: 6px; }
.item.archived .nm { color: var(--muted); font-weight: 500; }
.head-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-top: 12px; border-top: 1px solid var(--line); }
.head-actions .grow { flex: 1; }

.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 1.6; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; color: var(--muted); }
.pill.web { color: var(--good); border-color: currentColor; }
.pill.ai { color: var(--warn); border-color: currentColor; }
.pill.st-tested { color: var(--navy); border-color: currentColor; }
.pill.st-filmed { color: var(--amber); border-color: currentColor; }
.pill.st-posted { background: var(--good); color: var(--surface); border-color: var(--good); }

/* main */
.main { min-width: 0; display: grid; gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; min-width: 0; }
.head { display: grid; gap: 12px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
.head h1 { font-size: clamp(26px, 4vw, 40px); }
.verdict { max-width: 64ch; margin: 0; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.steps .lbl { font-size: 12px; color: var(--muted); margin-right: 4px; }
.step { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 2px 12px; font-size: 13px; cursor: pointer; }
.step[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.head-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.head-row .grow { flex: 1; }
.banner { font-size: 14px; padding: 10px 14px; border-radius: var(--r); background: var(--amber-soft); margin: 0; }
.banner.ok { background: var(--navy-soft); }

.tabs-wrap { overflow-x: auto; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); min-width: max-content; }
.tab { border: 0; background: transparent; padding: 8px 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--muted); font-size: 14px; }
.tab .n { font-family: var(--f-mono); font-size: 12px; margin-right: 6px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--amber); font-weight: 600; }

.page { display: grid; gap: 18px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: 18px; }
.sec-h { display: grid; gap: 2px; margin-bottom: 14px; }
.sec-h h2 { font-size: 20px; }
.sec-h p { margin: 0; font-size: 13px; color: var(--muted); }
.flag { color: var(--warn); font-weight: 600; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 9.5rem), 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; min-width: 0; }
.tile .l { font-size: 12px; color: var(--muted); }
.tile .v { font-family: var(--f-display); font-size: 18px; line-height: 1.45; margin-top: 2px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }

.concept-t { font-family: var(--f-display); font-style: italic; font-size: 22px; line-height: 1.3; margin: 0 0 6px; color: var(--amber); }
.quote { font-family: var(--f-display); font-size: 18px; line-height: 1.7; margin: 14px 0 0; padding-left: 14px; border-left: 3px solid var(--amber); }
.note-box { margin-top: 14px; padding: 10px 14px; border: 1px dashed var(--line); border-radius: var(--r); font-size: 14px; }
.dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; }
.dl dt { color: var(--muted); font-size: 13px; padding-top: 2px; }
.dl dd { margin: 0; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-block; font-size: 12px; padding: 0 10px; border-radius: 999px; background: var(--navy-soft); color: var(--navy); white-space: nowrap; }
.list { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

/* scent timeline */
.tl { display: grid; gap: 14px; }
.tl-row { display: grid; gap: 4px; }
.tl-lab { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.tl-lab b { font-family: var(--f-display); font-size: 17px; }
.tl-lab span { font-size: 13px; color: var(--muted); }
.tl-track { position: relative; height: 14px; background: var(--navy-soft); border-radius: 4px; }
.tl-bar { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.tl-sum { font-size: 13px; color: var(--muted); }
.tl-axis { position: relative; height: 20px; margin-top: 2px; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.tl-axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.tl-axis span.first { transform: none; }
.tl-axis span.last { transform: translateX(-100%); }

/* fit bars */
.bars { display: grid; grid-template-columns: minmax(5rem, max-content) minmax(0, 1fr) max-content; gap: 6px 12px; align-items: center; }
.bars .bl { font-size: 14px; }
.bars .bl small { display: block; font-size: 12px; color: var(--muted); line-height: 1.4; }
.bars .bt { height: 12px; background: var(--navy-soft); border-radius: 4px; position: relative; }
.bars .bt i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--s1); }
.bars .bt i.low { background: var(--muted); opacity: .55; }
.bars .bv { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.bars .bn { grid-column: 1 / -1; font-size: 13px; color: var(--muted); margin: -2px 0 6px; }

.tbl-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { vertical-align: top; padding: 9px 10px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
table.t tr:last-child td { border-bottom: 0; }
table.t tr.self td { background: var(--amber-soft); }
.nowrap { white-space: nowrap; }
.muted { color: var(--muted); }
.strong { font-weight: 600; }
.mono { font-family: var(--f-mono); font-size: 13px; color: var(--amber); }
.stage { display: inline-block; font-size: 12px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.meter { display: inline-block; width: 40px; height: 6px; border-radius: 3px; background: var(--navy-soft); margin-right: 6px; vertical-align: middle; overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 3px; }

.pc { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); gap: 18px; }
.pc h3 { font-size: 16px; margin-bottom: 4px; }
.pc ul { margin: 0; padding-left: 1.2em; }
.pc li + li { margin-top: 4px; }
.good { color: var(--good); }
.bad { color: var(--bad); }

.faq details { border-bottom: 1px solid var(--line); padding: 8px 0; }
.faq details:last-child { border-bottom: 0; }
.faq summary { cursor: pointer; font-weight: 600; }
.faq p { margin: 4px 0 0; color: var(--muted); }

/* script strip */
.strip { display: flex; gap: 2px; margin-bottom: 16px; position: relative; }
.strip > div { min-width: 0; }
.strip .seg { height: 14px; border-radius: 4px; }
.strip .sl, .strip .st { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip .sl { margin-top: 4px; }
.strip .st { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.toolbar select { border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; background: var(--surface); font-size: 14px; }

/* rollout */
.ro { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 2px; padding-top: 22px; margin-bottom: 14px; }
.ro .col { display: grid; justify-items: center; align-content: start; gap: 6px; border-left: 1px solid var(--line); padding: 4px 0; min-height: 70px; position: relative; }
.ro .col.zero { border-left: 1px dashed var(--amber); }
.ro .col.zero::before { content: "Reel တင်တဲ့နေ့"; position: absolute; top: -22px; left: 4px; font-size: 11px; color: var(--amber); white-space: nowrap; }
.ro .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--surface); cursor: pointer; padding: 0; }
.ro .day { font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-top: auto; white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
.tip { position: absolute; z-index: 3; pointer-events: none; max-width: 17rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 6px 24px rgba(0,0,0,.16); padding: 6px 10px; font-size: 13px; line-height: 1.6; }
.tip .th { color: var(--muted); font-size: 12px; }

/* captions */
.caps { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: 14px; }
.cap { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; min-width: 0; align-content: start; }
.cap-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.cap-h b { font-weight: 600; }
.cap-h span { flex: 1; font-size: 13px; color: var(--muted); }
.cap pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--f-body); font-size: 14px; line-height: 1.75; background: var(--bg); border-radius: 8px; padding: 10px 12px; }
.blank { background: var(--amber-soft); color: var(--amber); border-radius: 4px; padding: 0 4px; font-weight: 600; }
.filled { border-bottom: 2px solid var(--good); }

/* wear test */
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 13rem), 1fr)); gap: 12px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 13px; color: var(--muted); }
.field input, .field textarea { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 8px 10px; width: 100%; }
.field textarea { min-height: 64px; resize: vertical; line-height: 1.7; }
.field.wide { grid-column: 1 / -1; }
.save-state { font-size: 12px; color: var(--muted); min-height: 1.6em; margin-top: 8px; }
table.check td:first-child { width: 2.2rem; }
table.check input { width: 18px; height: 18px; accent-color: var(--amber); }
table.check tr.done td:not(:first-child) { color: var(--muted); text-decoration: line-through; }
.progress { height: 6px; background: var(--navy-soft); border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
.progress i { display: block; height: 100%; background: var(--good); border-radius: 3px; }

.pending { padding: 16px; border: 1px dashed var(--line); border-radius: var(--r); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 14px; color: var(--muted); }

/* accord colours (Fragrantica-style), light then dark */
:root { --a-sweet: #C2416E; --a-woody: #7A4E26; --a-fresh: #2B7BB0; --a-freshspicy: #2E8C7E; --a-spicy: #B8492A; --a-green: #3E7F45; --a-fruity: #D0603F; --a-amber: #A9741A; --a-floral: #8458B8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --a-sweet: #EE7FA6; --a-woody: #C89B6D; --a-fresh: #74B6E3; --a-freshspicy: #6CC7B6; --a-spicy: #EC8A68; --a-green: #84C48A; --a-fruity: #F29A7C; --a-amber: #E3B35A; --a-floral: #BB97E6; } }
:root[data-theme="dark"] { --a-sweet: #EE7FA6; --a-woody: #C89B6D; --a-fresh: #74B6E3; --a-freshspicy: #6CC7B6; --a-spicy: #EC8A68; --a-green: #84C48A; --a-fruity: #F29A7C; --a-amber: #E3B35A; --a-floral: #BB97E6; }

/* head: photo, accuracy, manage */
.head-top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: start; }
.head-top.nophoto { grid-template-columns: minmax(0, 1fr); }
.head-top .ttl { display: grid; gap: 6px; min-width: 0; }
.ph { width: 104px; height: 104px; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); cursor: zoom-in; background: var(--bg); display: block; }
.ph.big { width: 100%; height: auto; max-height: 70vh; object-fit: contain; grid-column: 1 / -1; cursor: zoom-out; }
.acc-status { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.acc-status .pill { font-size: 13px; padding: 2px 10px; }
button.pill { cursor: pointer; background: transparent; font: inherit; font-size: 13px; }
.pill.queue { color: var(--navy); border-color: currentColor; }
.manage { border-top: 1px solid var(--line); padding-top: 8px; }
.manage > summary { cursor: pointer; font-size: 13px; color: var(--muted); list-style: none; padding: 4px 0; }
.manage > summary::-webkit-details-marker { display: none; }
.manage[open] > summary { margin-bottom: 8px; }
.manage .head-actions { border-top: 0; padding-top: 8px; }

/* collapsible cards */
.fold > summary { list-style: none; cursor: pointer; }
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary .sec-h { margin-bottom: 0; padding-right: 30px; position: relative; }
.fold > summary .sec-h::after { content: "▾"; position: absolute; right: 2px; top: 2px; font-size: 18px; color: var(--muted); }
.fold[open] > summary .sec-h { margin-bottom: 14px; }
.fold[open] > summary .sec-h::after { content: "▴"; }

/* at a glance */
.glance { display: grid; gap: 18px; }
.glance .sec-h { margin-bottom: 0; }
.glance h3 { font-family: var(--f-body); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.acc { display: grid; gap: 7px; }
.acc-row { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr) 2.6rem; gap: 10px; align-items: center; font-size: 13px; }
.acc-row .an { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acc-row .ab { height: 16px; border-radius: 5px; background: var(--navy-soft); overflow: hidden; }
.acc-row .ab i { display: block; height: 100%; border-radius: 5px; }
.acc-row .ap { font-family: var(--f-mono); font-size: 12px; color: var(--muted); text-align: right; }
.meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); gap: 12px 22px; }
.mrow { display: grid; gap: 5px; font-size: 13px; }
.mrow .ml { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); }
.mrow .ml b { color: var(--ink); font-weight: 600; text-align: right; }
.dots5 { display: flex; gap: 4px; }
.dots5 i { flex: 1; height: 8px; border-radius: 4px; background: var(--navy-soft); }

  // draw each block to an image and stack the images on A4 pages; Burmese stays exactly as the browser shapes it
  // move a page cut up to the nearest all-light pixel row, so it falls between lines of text instead of through them
  function blankCut(c, sy, take) {
    try {
      const look = Math.min(take - 1, 190), top = sy + take - look;
      if (look < 8) return take;
      const d = c.getContext("2d").getImageData(0, top, c.width, look).data, w = c.width;
      for (let r = look - 1; r >= 0; r--) {
        let ok = true;
        for (let x = 0; x < w; x += 3) {
          const k = (r * w + x) * 4;
          if (d[k] * 0.299 + d[k + 1] * 0.587 + d[k + 2] * 0.114 < 200) { ok = false; break; }
        }
        if (ok) return Math.max(1, take - (look - 1 - r));
      }
    } catch (e) { /* unreadable canvas: cut where the page ends */ }
    return take;
  }
  async function savePdf(v) {
    const o = S.docv;
    if (!o || o.busy) return;
    const busy = (t) => { o.busy = t; const b = $("docv").querySelector(".dl-btn"); if (b) { b.textContent = t || "⬇️ PDF download"; b.disabled = !!t; } };
    busy("PDF ပြင်ဆင်နေတယ်…");
    let host = null;
    try {
      if (!S.downloads) throw { code: "unavailable" };
      await Promise.all([loadLib(LIBS.h2c), loadLib(LIBS.pdf)]);
      if (document.fonts?.ready) await document.fonts.ready;
      host = h("div", { class: "pdf-host", "aria-hidden": "true" }, docPaper(v, o));
      document.body.append(host);
      await Promise.all([...host.querySelectorAll("img")].map((im) => (im.complete ? null : new Promise((r) => { im.onload = im.onerror = r; }))));
      const blocks = [...host.querySelectorAll(".blk")];
      const pdf = new window.jspdf.jsPDF({ unit: "mm", format: "a4", orientation: "portrait", compress: true });
      const M = 12, W = 210 - M * 2, LIM = 297 - M - 6;
      const mmPerPx = W / host.firstChild.offsetWidth;
      let y = M;
      for (let i = 0; i < blocks.length; i++) {
        busy(`PDF ပြင်ဆင်နေတယ်… ${mmNum(Math.round((i / blocks.length) * 100))}%`);
        const el = blocks[i];
        const hMM = el.offsetHeight * mmPerPx;
        if (!hMM) continue;
        // a heading needs room for the start of what follows; a short block moves whole; a long block flows into the space left
        const KEEP = 30, WHOLE = 45, room = LIM - y;
        if (el.classList.contains("hd")) {
          const nx = blocks[i + 1] ? blocks[i + 1].offsetHeight * mmPerPx : 0;
          if (y > M && hMM + Math.min(nx, nx <= WHOLE ? nx : KEEP) > room) { pdf.addPage(); y = M; }
        } else if (y > M && hMM > room && !blocks[i - 1]?.classList.contains("hd") && (hMM <= WHOLE || room < 25)) { pdf.addPage(); y = M; }
        const c = await window.html2canvas(el, { scale: 1.6, backgroundColor: "#ffffff", useCORS: true, logging: false, scrollX: 0, scrollY: -window.scrollY, windowWidth: document.documentElement.clientWidth });
        const pxPerMM = c.height / hMM;
        let sy = 0;
        while (sy < c.height - 1) {
          let take = Math.min(c.height - sy, Math.max(1, Math.floor((LIM - y) * pxPerMM)));
          if (sy + take < c.height - 1) take = blankCut(c, sy, take);
          const part = document.createElement("canvas");
          part.width = c.width; part.height = take;
          part.getContext("2d").drawImage(c, 0, sy, c.width, take, 0, 0, c.width, take);

          sy += take; y += take / pxPerMM;
          if (sy < c.height - 1) { pdf.addPage(); y = M; }
        }
        y += 2;
      }
      const total = pdf.getNumberOfPages();
      for (let p = 1; p <= total; p++) { pdf.setPage(p); pdf.setFontSize(8); pdf.setTextColor(130); pdf.text(`Review Studio  ·  ${p} / ${total}`, 105, 297 - 6, { align: "center" }); }
      busy("Download လုပ်ဖို့ ခွင့်ပြုချက် စောင့်နေတယ်…");
      await S.downloads.save({ filename: `${slug(v.name) || "perfume"}.pdf`, data: pdf.output("blob") });
      toast(`📄 PDF သိမ်းပြီးပါပြီ — စာမျက်နှာ ${mmNum(total)} မျက်နှာ`);
    } catch (e) {
      toast(pdfErr(e));
    } finally {
      host?.remove();
      busy("");
    }
  }

      S.notice && S.notice.id === v.id ? h("p", { class: "banner ok" }, `"${S.notice.q}" က ${v.archived ? "Archive" : "library"} ထဲမှာ ရှိပြီးသားမို့ ဖွင့်ပေးလိုက်တယ်။ `,
        canAI ? h("button", { class: "btn small", type: "button", text: S.mcp && S.webOK ? "🌐 Web နဲ့ ပြန်ရှာမယ်" : "AI နဲ့ အသစ် ပြန်ရှာမယ်", onclick: () => { const q = S.notice.q; S.notice = null; if (S.mcp && S.webOK) webResearch(q, v.id); else research(q, true, v.origin === "ai" ? v.id : null); } }) : null) : null,
      !S.canWrite ? h("p", { class: "hint", text: "ကြည့်ရုံသာ ရပါတယ် — ပြင်ခွင့် မရှိပါ။" }) : null,
      v.archived ? h("p", { class: "banner ok", text: "📦 ဒီရေမွေးက Archive ထဲမှာ ပါပါတယ် — ပြန်သုံးချင်ရင် အောက်က \"Library ထဲ ပြန်ထည့်မယ်\" နှိပ်ပါ။" }) : null,
    ];
    const manage = S.manageOpen || v.archived ? h("section", { class: "card manage-card" },
      h("div", { class: "sec-h" }, h("h2", { text: "⚙️ စီမံရန်" })),
      h("div", { class: "steps", role: "group", "aria-label": "အခြေအနေ" }, h("span", { class: "lbl", text: "အခြေအနေ" }),
        STATUS.map(([k, l]) => h("button", { class: "step", type: "button", "aria-pressed": String(k === v.status), disabled: !S.canWrite, text: l, onclick: () => { patchDoc(v.id, { status: k }); render(); } }))),
      editable ? h("div", { class: "head-actions" },
        v.photo && S.assets ? h("label", { class: "btn" }, "📷 ပုံ ပြောင်းမယ်", h("input", { type: "file", accept: "image/*", hidden: true, onchange: (e) => uploadPhoto(v, e.target.files?.[0]) })) : null,
        archiveButton(v),
        canAI && S.mcp && S.webOK ? h("button", { class: "btn", type: "button", text: "🌐 Web နဲ့ ပြန်ရှာမယ်", onclick: () => webResearch(v.query || v.name, v.id) }) : null,
        v.origin !== "ai" && !v.verifyAt ? verifyControl(v, true) : null,
        canAI && v.origin === "ai" ? h("button", { class: "btn", type: "button", text: "🤖 AI နဲ့ ပြန်ရှာမယ်", onclick: () => research(v.query || v.name, true, v.id) }) : null,
        h("span", { class: "grow" }), deleteButton(v)) : null) : null;
    // the tab bar stays fixed at the bottom; tapping the open tab goes back to the top
    const tabs = h("nav", { class: "ptabs", role: "tablist", "aria-label": "အပိုင်းများ" }, PTABS.map(([k, l, ic]) => h("button", {
      role: "tab", id: "tab-" + k, "aria-selected": String(S.tab === k), type: "button",
      onclick: () => { if (S.tab !== k) { S.tab = k; render(); } window.scrollTo(0, 0); },
    }, icon(ic, 21), h("span", { text: l }))));
    const body = h("div", { class: "page", role: "tabpanel", "aria-labelledby": "tab-" + S.tab }, PAGES[S.tab](v));
    applyClamps(body);
    return [bar, hero, ...alerts, manage, body, tabs].filter(Boolean);
  }

  // ---------- filming mode: a full-screen teleprompter ----------
  function shootScenes(v, mode) {
    if (mode === "reel") return arr(v.script).map((r) => ({ title: r.part || "", start_s: r.start_s, end_s: r.end_s, shots: r.shot ? [r.shot] : [], sfx: "", broll: [], subsections: [], lines: r.say ? [r.say] : [], screen: r.screen ? [r.screen] : [], note: "" }));
    return arr(obj(v.longscript).scenes).map(normScene).filter((s) => s.title || s.lines.length || s.subsections.length);
  }
  const SH = { raf: 0, last: 0, wait: 0 };
  function openShoot(id, mode) {
    const d = S.docs.get(id);
    if (!d) return;
    const v = view(d);
    const m = mode || (shootScenes(v, "long").length ? "long" : "reel");
    if (!shootScenes(v, m).length) { toast("Script မထုတ်ရသေးပါ"); return; }
    S.shoot = { id, mode: m, i: 0, speed: S.shoot?.speed || 1, size: S.shoot?.size ?? 1, playing: false };
    document.body.classList.add("shooting");
    renderShoot();
  }
  function stopRoll() { cancelAnimationFrame(SH.raf); clearTimeout(SH.wait); SH.raf = 0; SH.last = 0; if (S.shoot) S.shoot.playing = false; }
  function closeShoot() { stopRoll(); S.shoot = null; $("shoot").hidden = true; $("shoot").replaceChildren(); document.body.classList.remove("shooting"); }
  function roll(t) {
    const box = $("shoot").querySelector(".sh-text");
    if (!S.shoot?.playing || !box) return;
    const dt = SH.last ? Math.min(100, t - SH.last) : 16;
    SH.last = t;
    box.scrollTop += (dt / 1000) * 32 * S.shoot.speed;
    if (box.scrollTop + box.clientHeight >= box.scrollHeight - 2) {
      const sh = S.shoot, total = shootScenes(view(S.docs.get(sh.id) || {}), sh.mode).length;
      if (sh.i >= total - 1) { stopRoll(); renderShoot(true); return; }
      SH.raf = 0;
      SH.wait = setTimeout(() => { if (!S.shoot?.playing) return; S.shoot.i++; renderShoot(); SH.last = 0; SH.raf = requestAnimationFrame(roll); }, 2500 / sh.speed);
      return;
    }
    SH.raf = requestAnimationFrame(roll);
  }
  function renderShoot(keepScroll) {
    const sh = S.shoot;
    const d = sh && S.docs.get(sh.id);
    if (!sh || !d) { closeShoot(); return; }
    const v = view(d);
    const scenes = shootScenes(v, sh.mode);
    if (!scenes.length) { closeShoot(); return; }
    sh.i = clamp(sh.i, 0, scenes.length - 1);
    const s = scenes[sh.i];
    const ov = $("shoot");
    const prev = keepScroll ? ov.querySelector(".sh-text")?.scrollTop || 0 : 0;
    const go = (di) => { stopRoll(); sh.i = clamp(sh.i + di, 0, scenes.length - 1); renderShoot(); };
    const autoNote = sh.playing ? "▶ အလိုလို ရွှေ့နေတယ် — scene ဆုံးရင် ခဏနားပြီး နောက် scene ဆက်သွားမယ်" : null;
    const last = sh.i === scenes.length - 1;
    const both = shootScenes(v, "long").length && shootScenes(v, "reel").length;
    const time = sh.mode === "reel" ? `${s.start_s}–${s.end_s}s` : `${mmss(s.start_s)} – ${mmss(s.end_s)}`;
    const dirs = [["ရိုက်ကွက်", s.shots.join(" · ")], ["SFX", s.sfx], ["B-roll", s.broll.join("၊ ")]].filter(([, t]) => str(t).trim());
    const filmed = v.status === "filmed" || v.status === "posted";
    const text = h("div", { class: "sh-text sz" + sh.size },
      s.subsections.map((x) => [x.title ? h("h3", {}, flagText(x.title)) : null, x.lines.map((l) => h("p", {}, flagText(fill(l, v))))]),
      s.lines.map((l, i) => h("p", { class: i === 0 && !s.subsections.length ? "cur" : null }, flagText(fill(l, v)))),
      s.screen.length ? h("div", { class: "sh-screen" }, h("span", { class: "k", text: "SCREEN" }), s.screen.map((t) => h("span", { class: "chip2" }, flagText(fill(t, v))))) : null,
      s.note ? h("p", { class: "sh-note" }, "⚠️ ", flagText(fill(s.note, v))) : null,
      last ? h("div", { class: "sh-done" }, filmed ? h("span", { text: "✓ ရိုက်ပြီးလို့ မှတ်ထားပြီး" }) : h("button", { type: "button", disabled: !S.canWrite || !S.db, onclick: () => { patchDoc(v.id, { status: "filmed" }); toast("✓ ရိုက်ပြီးလို့ မှတ်ပြီးပါပြီ — Post tab မှာ caption ကူးပြီး တင်ပါ"); closeShoot(); S.tab = "post"; render(); } }, "✓ ရိုက်ပြီးပြီ")) : null);
    ov.replaceChildren(
      h("div", { class: "sh-top" },
        h("button", { class: "sh-btn", type: "button", "aria-label": "ပိတ်မယ်", onclick: closeShoot }, icon("close", 20)),
        h("div", { class: "sh-name" }, h("b", { text: v.name }),
          both ? h("div", { class: "sh-mode" }, [["long", "ဗီဒီယိုရှည်"], ["reel", "Reel ၆၀s"]].map(([k, l]) => h("button", { type: "button", "aria-pressed": String(sh.mode === k), text: l, onclick: () => { stopRoll(); sh.mode = k; sh.i = 0; renderShoot(); } })))
            : h("span", { class: "sh-sub", text: sh.mode === "reel" ? "Reel ၆၀ စက္ကန့်" : "ဗီဒီယိုရှည်" })),
        h("button", { class: "sh-btn", type: "button", "aria-label": "စာလုံး အရွယ်", text: "Aa", onclick: () => { sh.size = (sh.size + 1) % 3; renderShoot(true); } })),
      h("div", { class: "sh-prog", role: "img", "aria-label": `Scene ${sh.i + 1} / ${scenes.length}` }, scenes.map((_, i) => h("i", { class: i === sh.i ? "on" : i < sh.i ? "past" : null }))),
      h("div", { class: "sh-meta" }, h("span", { class: "n", text: `SCENE ${sh.i + 1} / ${scenes.length}` }), h("b", {}, flagText(s.title)), h("span", { class: "t", text: time })),
      dirs.length ? h("div", { class: "sh-dir" }, dirs.map(([k, t]) => h("div", {}, h("span", { class: "k", text: k }), flagText(t)))) : null,
      text,
      h("div", { class: "sh-ctl" },
        h("div", { class: "sh-speed" }, [0.8, 1, 1.3].map((x) => h("button", { type: "button", "aria-pressed": String(sh.speed === x), text: x.toFixed(1) + "x", onclick: () => { sh.speed = x; renderShoot(true); if (sh.playing) SH.raf = requestAnimationFrame(roll); } }))),
        h("div", { class: "sh-row" },
          h("button", { class: "sh-btn big", type: "button", "aria-label": "အရင် scene", disabled: sh.i === 0, onclick: () => go(-1) }, icon("back", 22)),
          h("button", { class: "sh-play", type: "button", "aria-label": sh.playing ? "ရပ်မယ်" : "စာ အလိုလို ရွှေ့မယ်", onclick: () => {
            if (sh.playing) { stopRoll(); renderShoot(true); return; }
            sh.playing = true; renderShoot(true); SH.last = 0; SH.raf = requestAnimationFrame(roll);
          } }, icon(sh.playing ? "pause" : "play", 28, !sh.playing)),
          h("button", { class: "sh-btn big", type: "button", "aria-label": "နောက် scene", disabled: last, onclick: () => go(1) }, icon("next", 22))),
        h("p", { class: "sh-next", text: autoNote || (last ? "နောက်ဆုံး scene" : `နောက် scene · ${scenes[sh.i + 1].title}`) })));
    ov.hidden = false;
    if (keepScroll) text.scrollTop = prev;
  }

  function render() {
    const ae = document.activeElement;
    if (ae && main.contains(ae) && ae.matches("input:not([type=checkbox]), textarea")) { S.pendingRender = true; renderLib(); return; }
    S.pendingRender = false;
    renderLib();
    $("go").disabled = !!S.busy || !S.canWrite;
    if (S.ready) {
      $("top-hint").textContent = !S.sample
        ? "ဒီ view မှာ AI နဲ့ ရှာလို့ မရပါ — claude.ai ထဲမှာ ဖွင့်ပါ။ Library ထဲက ရေမွေးတွေကိုတော့ ကြည့်လို့ရတယ်။"
        : !S.canWrite ? "ကြည့်ရုံပဲ ရပါတယ် — ရှာဖို့/ပြင်ဖို့ ခွင့်ပြုချက် လိုတယ်။"
        : S.mcp && S.webOK ? "🌐 Web (Fragrantica၊ Parfumo၊ brand site) ကနေ တိုက်ရိုက်ရှာပြီး source link တွေနဲ့ ရေးပေးမယ် (၁–၂ မိနစ်)။ ကိုယ့် Claude usage ကို သုံးပါတယ်။"
        : "⚠️ Web ရှာလို့ မရသေးလို့ AI က မှတ်ဉာဏ်နဲ့ AI draft ရေးမယ် — ပြီးရင် အပြင်က info နဲ့ စစ်ထုတ်ပါ။ (Web ရှာဖို့ claude.ai မှာ Parallel Search connector ချိတ်ပါ)";
    }
    const d = S.cur ? S.docs.get(S.cur) : null;
    if (!d) S.manageOpen = false;
    main.replaceChildren(...(d ? perfumeView(d) : S.mode === "vs" ? vsView() : S.view === "library" ? libraryView() : homeView()));
    const app = document.querySelector(".app");
    const onHome = !d && S.mode !== "vs" && S.view !== "library";
    app.classList.toggle("is-perfume", !!d);
    app.classList.toggle("on-home", onHome);
    $("bnav").hidden = !!d;
    $("nav-home").setAttribute("aria-current", onHome ? "page" : "false");
    $("nav-lib").setAttribute("aria-current", !d && !onHome ? "page" : "false");
    $("home-btn").setAttribute("aria-current", String(onHome));
    if (S.shoot) renderShoot(true);
  }

  main.addEventListener("focusout", () => setTimeout(() => { if (S.pendingRender) render(); }, 0));

  // ---------- boot ----------
  render();
  (async () => {
    const c = window.claude;
    const use = (n) => (c && typeof c.use === "function" ? c.use(n).catch(() => null) : Promise.resolve(null));
    const [sample, db, user, assets, mcp, downloads] = await Promise.all([use("sample"), use("db"), use("user"), use("assets"), use("mcp"), use("downloads")]);
    S.sample = sample; S.db = db; S.assets = assets; S.mcp = mcp; S.downloads = downloads;
    if (sample && typeof sample.limits === "function") { try { S.imgLimits = (await sample.limits())?.images || null; } catch (e) { S.imgLimits = null; } }
    if (user) { try { if ((await user.can("data.write")) === false) S.canWrite = false; } catch (e) { /* keep */ } }
    if (!db) { S.dbMissing = true; S.ready = true; render(); return; }
    let first = true;
    db.collection("perfumes").onSnapshot((snap) => {
      const next = new Map();
      snap.docs.forEach((doc) => { const x = doc.data(); if (x) next.set(doc.id, { ...x, id: doc.id }); });
      S.docs = next;
      S.ready = true;
      if (first) {
        first = false;
        const hash = location.hash.slice(1);
        S.cur = hash && next.has(hash) ? hash : null;
      }
      if (S.cur && !next.has(S.cur)) S.cur = null;
      render();
    }, () => { S.dbMissing = true; S.ready = true; render(); });
  })();
})();
</script>
